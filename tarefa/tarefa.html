<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cabecalho">
        <h1><span>TAREFAS</span></h1>
    </div>

    <form>
        <label for="tarefa">Nova Tarefa:</label>
        <input type="text" name="Tarefa" id="tarefa" placeholder="Insiria uma nova tarefa">
    </form>

    <h2>Minhas tarefas</h2>
    <form>
        <input type="checkbox" id="git">
        <label for="git">Estudar Git</label>

        <input type="checkbox" id="exer">
        <label for="exer">Fazer Exercícios</label>

        <input type="checkbox" id="rpr">
        <label for="rpr">Revisar Pull Request</label>
    </form>
</body>
</html>
