<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <div class="container header-content">
            <h1>TAREFAS</h1>
            <nav>
                <a href="../home/index.html" class="active">Home</a>
            </nav>
        </div>
    </header>
    <div class="corpo">
        <div class="tarefa">
            <h2><span>Insira novas tarefas</span></h2>
            <form>
                <label for="tarefa">Nova Tarefa:</label>
                <input type="text" name="Tarefa" id="tarefa" placeholder="Insiria uma nova tarefa">
                <button>Adicionar Tarefa</button>
            </form>
        </div>
        <div class="formulario">
            <h2><span>Minhas tarefas</span></h2>
            <form>
                <ul>
                    <li>
                        <input type="checkbox" id="git">
                        <label for="git">Estudar Git</label>
                    </li>
                    <li>
                        <input type="checkbox" id="exer">
                        <label for="exer">Fazer Exercícios</label>
                    </li>
                    <li>
                        <input type="checkbox" id="rpr">
                        <label for="rpr">Revisar Pull Request</label>
                    </li>
                </ul>
            </form>
        </div>
    </div>
</body>

</html>
