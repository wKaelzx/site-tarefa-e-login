<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Usuários</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <main class="card-container">
    <header class="card-header">
      <h2>Usuários</h2>
      <p class="subtitle">Gerencie o acesso de usuários ao sistema</p>
    </header>
    
    <form class="user-form" action="#" method="POST" onsubmit="return false;">
      <div class="form-group">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Digite o nome completo" required>
      </div>
      
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="nome@exemplo.com" required>
      </div>
      
      <button type="submit" class="btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Adicionar usuário
      </button>
    </form>

    <section class="users-section">
      <h3 class="section-title">Usuários cadastrados</h3>
      
      <ul class="user-list">
        <li class="user-item">
          <div class="user-avatar">A</div>
          <div class="user-info">
            <span class="user-name">Ana</span>
            <span class="user-email">ana@email.com</span>
          </div>
          <div class="user-actions">
            <button type="button" class="btn-icon" title="Excluir">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </div>
        </li>
        
        <li class="user-item">
          <div class="user-avatar">C</div>
          <div class="user-info">
            <span class="user-name">Carlos</span>
            <span class="user-email">carlos@email.com</span>
          </div>
          <div class="user-actions">
            <button type="button" class="btn-icon" title="Excluir">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </div>
        </li>
        
        <li class="user-item">
          <div class="user-avatar">M</div>
          <div class="user-info">
            <span class="user-name">Marina</span>
            <span class="user-email">marina@email.com</span>
          </div>
          <div class="user-actions">
            <button type="button" class="btn-icon" title="Excluir">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </div>
        </li>
      </ul>
    </section>
  </main>

</body>
</html>
